whitelist:
- alarm_name_equals: ET INFO Terse Request for .txt - Likely Hostile
  reason: The alert was triggered by a request for a .txt file that matched a generic
    IDS signature. Investigation found the request to be part of legitimate application
    or web activity with no evidence of malicious exploitation.
- alarm_name_equals: Agent event queue is 90% full.
  reason: The alert was triggered because the monitoring agent queue reached a high
    utilization level due to increased event volume. Investigation confirmed this
    was an operational performance issue with no security impact.
- alarm_name_equals: 'Apache: Invalid URI (bad client request).'
  reason: The request was rejected by the web server with no evidence of successful
    exploitation, unauthorized access, or malicious activity.
- alarm_name_equals: 'Apache: Attempt to access forbidden directory index.'
  reason: The alert was triggered by a web request attempting to access a directory
    without an available index file or with directory listing disabled with no evidence
    of successful exploitation, unauthorized access, or sensitive data exposure.
- alarm_name_equals: Agent event queue is full. Events may be lost.
  reason: The alert was triggered because the monitoring agent queue reached capacity
    and may have dropped events. Investigation identified this as an agent performance
    issue rather than a security incident.
- alarm_name_equals: 'Audit Log: Process Execution'
  reason: The alert was triggered by a process execution event recorded in the audit
    logs. Investigation confirmed the process was legitimate and no evidence of malicious
    execution was identified.
- alarm_name_equals: AV DOS Possible Black Nurse attack from Internal Source
  reason: The activity was caused by legitimate network diagnostics, monitoring, or
    internal communication behavior, with no evidence of an actual DoS attack or service
    disruption identified.
- alarm_name_equals: Bash Script Execution Detected on Host
  reason: The alert was triggered by the execution of a Bash script as part of normal
    administrative, automation, or application activities. Investigation found no
    evidence of malicious script execution or unauthorized activity.
- alarm_name_equals: Common web attack.
  reason: The alert was triggered by a web request that matched a generic web attack
    signature with no evidence of successful exploitation, unauthorized access, or
    security impact identified.
- alarm_name_equals: Failed attempt to perform a privileged operation
  reason: The alert was triggered by a failed privileged operation due to insufficient
    permissions or normal user activity. Investigation found no evidence of privilege
    escalation attempts or malicious behavior.
- alarm_name_equals: 'Fortigate: Blocked URL belongs to a denied category in policy.'
  reason: The alert was triggered because Fortigate blocked access to a URL that matched
    a restricted web category defined in the security policy.
- alarm_name_equals: '[Fortigate][Cloud] Pontentially Unwanted App passed by firewall.'
  reason: The alert was triggered because Fortigate identified allowed network traffic
    associated with a potentially unwanted application category
- alarm_name_equals: Host-based anomaly detection event (rootcheck).
  reason: The alert was triggered by a system change detected by rootcheck that matched
    a suspicious behavior pattern. Investigation found the activity to be benign with
    no evidence of rootkit installation or host compromise.
- alarm_name_equals: '[GCP] Cloud SQL Service Severity: ERROR'
  reason: The alert was triggered by a Cloud SQL service error caused by a routine
    operational or configuration issue. Investigation found no evidence of unauthorized
    access, data compromise, or malicious activity.
- alarm_name_equals: '[GCP] Cloud SQL Service Unauthorized Access on Instance'
  reason: The alert was triggered by an access attempt to a Cloud SQL instance that
    matched an unauthorized access detection rule. Investigation confirmed the activity
    was related to legitimate administrative access with no evidence of compromise.
- alarm_name_equals: '[GCP] gce_instance Event-Type: ERROR Source: Predator Rest Service'
  reason: The alert was triggered by an error event generated by the Predator Rest
    Service running on a GCP compute instance.
- alarm_name_equals: '[GCP] New VM instance created'
  reason: The activity was initiated by the authorized Dataproc service account as
    part of a legitimate automated workload deployment, with no evidence of unauthorized
    resource creation or malicious activity.
- alarm_name_equals: '[GCP][Loadbalancer] Denied by Security Policy'
  reason: The alert was triggered because the Google Cloud Load Balancer blocked traffic
    according to an existing security policy. Investigation found no evidence of successful
    attack attempts or security impact.
- alarm_name_equals: Insecure File Permission Change Detected
  reason: The alert was triggered by a file permission change during legitimate system
    administration or application activity. Investigation found no evidence of unauthorized
    access or malicious file modification.
- alarm_name_equals: Integrity checksum changed.
  reason: The alert was triggered due to a checksum change caused by legitimate file
    updates, application changes, or system maintenance. Investigation found no evidence
    of unauthorized file modification or malicious activity.
- alarm_name_equals: Interface entered in promiscuous(sniffing) mode.
  reason: The alert was triggered because a network interface entered promiscuous
    mode due to legitimate monitoring, virtualization, or security tools. Investigation
    found no evidence of unauthorized packet sniffing or malicious network activity.
- alarm_name_equals: Listened ports status (netstat) changed (new port opened or closed).
  reason: The alert was triggered by a legitimate change in listening ports caused
    by application updates, service changes, or system maintenance. Investigation
    found no evidence of unauthorized services or suspicious network activity.
- alarm_name_equals: Multiple Windows error events.
  reason: The alert was triggered by repeated SQLVDI application error events related
    to a client-initiated abort during a Microsoft SQL Server backup or database operation
- alarm_name_equals: Multiple common web attacks from same source ip.
  reason: The alert was triggered by multiple web requests from the same source IP
    containing attack patterns such as directory traversal attempts targeting sensitive
    files and the requests were unsuccessful and returned HTTP 404 responses
- alarm_name_equals: Nginx error message.
  reason: The alert was triggered by an Nginx error log entry caused by a routine
    web server or application issue.
- alarm_name_equals: Registry Key Integrity Checksum Changed
  reason: The alert was triggered because the integrity checksum of a Windows registry
    key changed due to legitimate system updates, application modifications, or configuration
    changes.
- alarm_name_equals: Registry Value Integrity Checksum Changed
  reason: The alert was triggered because a registry value checksum changed due to
    legitimate system updates, application changes, or configuration adjustments.
    Investigation found no evidence of malicious registry modification or persistence.
- alarm_name_equals: Root's crontab entry changed.
  reason: The alert was triggered by a modification to the root user's crontab entry
    during legitimate system administration or software maintenance. Investigation
    found no evidence of unauthorized persistence or malicious scheduled tasks.
- alarm_name_equals: 'Systemd: Service exited due to a failure.'
  reason: The alert was triggered by a routine technical failure of an internal application
    or system service. Investigation found no evidence of malicious activity or service
    manipulation.
- alarm_name_equals: Shellshock attack detected
  reason: The alert was triggered by a web request containing a Shellshock exploit
    pattern in the User-Agent header. The request did not result in successful command
    execution or system compromise.
- alarm_name_equals: Summary event of the report's signatures.
  reason: The event indicates activity that matches normal application communication
    patterns. No indication of malicious behavior or exploitation attempts was identified.
- alarm_name_equals: 'sshd: Possible attack on the ssh server (or version gathering).'
  reason: The alert was triggered by an SSH connection attempt sending an invalid
    protocol identification string instead of a valid SSH handshake with no evidence
    of successful authentication, unauthorized access, or SSH server compromise was
    identified.
- alarm_name_equals: Web server 400 error code.
  reason: The alert was triggered by an HTTP 400 response caused by an invalid or
    malformed request. Investigation found no evidence of successful exploitation
    or security impact.
- alarm_name_equals: Web server 500 error code (Internal Error).
  reason: The alert was triggered by an HTTP 500 response indicating a temporary internal
    server-side error.
- alarm_name_equals: Windows audit failure event
  reason: The alert was triggered by a failed Windows audit event related to authentication
    or policy validation. Investigation found no evidence of unauthorized access or
    malicious activity.
- alarm_name_equals: Windows error event.
  reason: The alert was triggered by a Windows system or application error event recorded
    in the event log.
- alarm_name_equals: XSS (Cross Site Scripting) attempt.
  reason: The alert was triggered by a web request containing patterns that matched
    a potential XSS attack signature with no evidence of successful script execution,
    data compromise, or security impact identified.
- alarm_name_equals: 'PAM: Login session opened.'
  reason: Informational
- alarm_name_equals: 'PAM: Login session closed.'
  reason: Informational
- alarm_name_equals: 'sshd: authentication success.'
  reason: The alert was triggered by a routine technical failure of an internal application
    or system service. Investigation found no evidence of malicious activity or service
    manipulation.
- alarm_name_equals: ET INFO External IP Address Lookup Domain (ipify .org) in TLS
    SNI
  reason: The alert was triggered by a request for a .org that matched a generic IDS
    signature. Investigation found the request to be part of legitimate application
    or web activity with no evidence of malicious exploitation.

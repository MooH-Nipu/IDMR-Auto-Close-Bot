services:
  app:
    build: .
    container_name: idmr-auto-close
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT:-5000}:5000"
    environment:
      IDMR_ALLOWED_ORIGINS: "${IDMR_ALLOWED_ORIGINS:?set IDMR_ALLOWED_ORIGINS in .env}"
      CONFIG_DIR: /data
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

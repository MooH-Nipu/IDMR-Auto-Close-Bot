services:
  init-config:
    build: .
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        cp -n /app/settings.yaml /data/settings.yaml;
        cp -n /app/whitelist.yaml /data/whitelist.yaml;
        cp -n /app/protect_list.yaml /data/protect_list.yaml;
        chown -R ${HOST_UID:-1000}:${HOST_GID:-1000} /data
    volumes:
      - config_data:/data
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN

  app:
    build: .
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      init-config:
        condition: service_completed_successfully
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT:-5000}:5000"
    environment:
      IDMR_ALLOWED_ORIGINS: "${IDMR_ALLOWED_ORIGINS:?set IDMR_ALLOWED_ORIGINS in .env}"
      IDMR_TLS_INSECURE: "${IDMR_TLS_INSECURE:-false}"
      IDMR_CA_BUNDLE: "${IDMR_CA_BUNDLE:-}"
      CONFIG_DIR: /data
    volumes:
      - config_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  config_data:
